services:
  db:
    image: postgres:16-alpine
    container_name: pf-postgres
    environment:
      POSTGRES_DB: printable_forms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/create_params_table.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/variables_export/ddu_variables.sql:/docker-entrypoint-initdb.d/02-ddu.sql
    restart: unless-stopped
    networks:
      - pf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pf-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=True
      - PRINTABLE_FORMS_BASE_URL=${PRINTABLE_FORMS_BASE_URL:-}
      - KEYCLOAK_CLIENT_API=${KEYCLOAK_CLIENT_API:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - CACHE_TTL=3600
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=printable_forms
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - USE_DATABASE_DIRECT=True
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pf-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pf-network

volumes:
  postgres_data:
    driver: local

networks:
  pf-network:
    driver: bridge
