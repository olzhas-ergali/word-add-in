<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2b579a;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background-color: #2b579a;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background-color: #1e3f72;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 CORS Test Page</h1>
        <p>Тестирование подключения Frontend → Backend</p>

        <div>
            <button onclick="testHealth()">Test /health</button>
            <button onclick="testDocuments()">Test /api/documents/list</button>
            <button onclick="testAuth()">Test /api/auth/validate</button>
            <button onclick="clearResults()">Очистить</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        function addResult(title, status, data) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${status}`;
            
            let content = `<strong>${title}</strong><br>`;
            if (status === 'success') {
                content += '✅ Успешно<br>';
            } else if (status === 'error') {
                content += '❌ Ошибка<br>';
            } else {
                content += 'ℹ️ Информация<br>';
            }
            content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            
            resultDiv.innerHTML = content;
            resultsDiv.appendChild(resultDiv);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testHealth() {
            try {
                addResult('Testing /health', 'info', { url: `${API_URL}/health` });
                
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    addResult('GET /health', 'success', {
                        status: response.status,
                        headers: {
                            'access-control-allow-origin': response.headers.get('access-control-allow-origin'),
                            'access-control-allow-credentials': response.headers.get('access-control-allow-credentials'),
                        },
                        data: data
                    });
                } else {
                    addResult('GET /health', 'error', {
                        status: response.status,
                        data: data
                    });
                }
            } catch (error) {
                addResult('GET /health', 'error', {
                    error: error.message,
                    type: error.name,
                    note: 'Возможно CORS заблокирован или backend не запущен'
                });
            }
        }

        async function testDocuments() {
            try {
                addResult('Testing /api/documents/list', 'info', { url: `${API_URL}/api/documents/list` });
                
                const response = await fetch(`${API_URL}/api/documents/list`);
                const data = await response.json();
                
                if (response.ok) {
                    addResult('GET /api/documents/list', 'success', {
                        status: response.status,
                        documentsCount: Array.isArray(data) ? data.length : 'N/A',
                        sample: Array.isArray(data) && data.length > 0 ? data[0] : null
                    });
                } else {
                    addResult('GET /api/documents/list', 'error', {
                        status: response.status,
                        data: data
                    });
                }
            } catch (error) {
                addResult('GET /api/documents/list', 'error', {
                    error: error.message,
                    type: error.name
                });
            }
        }

        async function testAuth() {
            try {
                addResult('Testing /api/auth/validate', 'info', { url: `${API_URL}/api/auth/validate` });
                
                const response = await fetch(`${API_URL}/api/auth/validate`, {
                    headers: {
                        'X-Session-ID': 'test-session-id'
                    }
                });
                const data = await response.json();
                
                if (response.ok) {
                    addResult('GET /api/auth/validate', 'success', {
                        status: response.status,
                        data: data
                    });
                } else {
                    addResult('GET /api/auth/validate', 'error', {
                        status: response.status,
                        data: data
                    });
                }
            } catch (error) {
                addResult('GET /api/auth/validate', 'error', {
                    error: error.message,
                    type: error.name
                });
            }
        }

        // Автоматический тест при загрузке страницы
        window.addEventListener('load', () => {
            addResult('CORS Test Page загружена', 'info', {
                frontend: window.location.href,
                backend: API_URL,
                note: 'Нажмите кнопки для тестирования endpoints'
            });
        });
    </script>
</body>
</html>
