upstream pf_backend {
    server backend:8000;
}

# HTTPS — для Word/manifest (https://localhost:3000/...)
server {
    listen 3000 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    root /usr/share/nginx/html;
    index taskpane.html;

    location = /favicon.ico {
        alias /usr/share/nginx/html/assets/icon-16.png;
        default_type image/png;
        access_log off;
    }

    location /api/ {
        proxy_pass http://pf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /taskpane.html;
    }
    location ~* \.(js|css|png|ico|xml|html)$ {
        add_header Cache-Control "no-cache";
    }
}

# HTTP — если открыли http://localhost:3001 (не смешивать с портом 3000, где только SSL)
server {
    listen 3001;
    server_name localhost;

    root /usr/share/nginx/html;
    index taskpane.html;

    location = /favicon.ico {
        alias /usr/share/nginx/html/assets/icon-16.png;
