<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
</head>
<body>
    <script>
        Office.onReady(() => {});

        async function fillVariables(event) {
            try {
                if (typeof Word === 'undefined') {
                    throw new Error('Word API не доступен. Эта функция работает только внутри Word.');
                }
                
                const API_URL = CONFIG.API_BASE_URL;
                let contractId = localStorage.getItem('current_contract_id');
                
                if (!contractId) {
                    contractId = prompt('Введите Contract ID:', 'DDU-2024-001');
                    if (!contractId) {
                        throw new Error('Contract ID не указан');
                    }
                    localStorage.setItem('current_contract_id', contractId);
                }

                await Word.run(async (context) => {
                    const doc = context.document;
                    const body = doc.body;
                    body.load('text');
                    await context.sync();
                    
                    const response = await fetch(`${API_URL}/api/params/contract/${contractId}`);
                    
                    if (!response.ok) {
                        throw new Error('Не удалось получить параметры из БД');
                    }
                    
                    const data = await response.json();
                    const parameters = data.parameters;
                    
                    if (!parameters || parameters.length === 0) {
                        throw new Error(`Нет параметров для договора ${contractId} в БД`);
                    }

                    const selectedDoc = localStorage.getItem(CONFIG.STORAGE_KEYS.SELECTED_DOCUMENT);
                    let variablesMap = {};
                    
                    if (selectedDoc) {
                        try {
                            const doc = JSON.parse(selectedDoc);
                            const documentId = doc.documentId || doc.document_id;
                            const varResponse = await fetch(`${API_URL}/api/variables/document/${documentId}`);
                            const varData = await varResponse.json();
                            
                            if (varData.variables) {
                                varData.variables.forEach(v => {
                                    variablesMap[v.name] = v.name;
                                });
                            }
                        } catch (err) {
                            console.warn('Could not load variable mappings:', err);
                        }
                    }

                    let replacedCount = 0;
                    const fields = body.fields;
                    fields.load('items');
                    await context.sync();

                    for (const param of parameters) {
                        const paramName = param.param_name;
                        const paramValue = param.param_value || 'Не заполнено';
                        const variableName = variablesMap[paramName];
                        
                        for (let i = 0; i < fields.items.length; i++) {
                            const field = fields.items[i];
                            field.load('code,result');
                            await context.sync();
                            
                            const fieldCode = field.code;
                            if (fieldCode.includes('DOCVARIABLE') && 
                                (fieldCode.includes(paramName) || (variableName && fieldCode.includes(variableName)))) {
                                field.result.insertText(paramValue, Word.InsertLocation.replace);
                                replacedCount++;
                            }
                        }
                        
                        const patterns = [];
                        if (variableName && variableName !== paramName) {
                            patterns.push(`{{${variableName}}}`);
                            patterns.push(`{${variableName}}`);
                            patterns.push(`[${variableName}]`);
                        }
                        patterns.push(`{{${paramName}}}`);
                        patterns.push(`{${paramName}}`);
                        patterns.push(`[${paramName}]`);
                        patterns.push(`\${${paramName}}`);
                        
                        for (const pattern of patterns) {
                            const searchResults = body.search(pattern, {matchCase: false, matchWholeWord: false});
                            searchResults.load('items');
                            await context.sync();
                            
                            if (searchResults.items.length > 0) {
                                for (let i = 0; i < searchResults.items.length; i++) {
                                    searchResults.items[i].insertText(paramValue, Word.InsertLocation.replace);
                                    replacedCount++;
                                }
                            }
                        }
                    }
                    
                    await context.sync();
                    alert(`Заполнено ${replacedCount} переменных\n\nПоддерживаются форматы:\n{{ DOCVARIABLE НомерДоговора }}\n{{НомерДоговора}}\n{CONTRACT_NUMBER}`);
                });

                event.completed();
                
            } catch (error) {
                console.error('Error filling variables:', error);
                alert('Ошибка: ' + error.message);
                event.completed();
            }
        }

        async function logout(event) {
            try {
                await apiService.logout();
                event.completed();
            } catch (error) {
                event.completed();
            }
        }
    </script>
</body>
</html>
