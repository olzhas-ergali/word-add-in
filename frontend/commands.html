<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
</head>
<body>
    <script>
        Office.onReady(() => {
            // Register command handlers
        });

        /**
         * Fill variables in the document from DATABASE (not API!)
         */
        async function fillVariables(event) {
            try {
                const API_URL = CONFIG.API_BASE_URL;
                
                // Получаем contract_id из localStorage или спрашиваем у пользователя
                let contractId = localStorage.getItem('current_contract_id');
                
                if (!contractId) {
                    // Если не сохранен, используем дефолтный или спрашиваем
                    contractId = prompt('Введите Contract ID:', 'DDU-2024-001');
                    if (!contractId) {
                        throw new Error('Contract ID не указан');
                    }
                    localStorage.setItem('current_contract_id', contractId);
                }

                await Word.run(async (context) => {
                    const doc = context.document;
                    const body = doc.body;
                    
                    // Получаем параметры из БД (не из API!)
                    const response = await fetch(`${API_URL}/api/params/contract/${contractId}`);
                    
                    if (!response.ok) {
                        throw new Error('Не удалось получить параметры из БД');
                    }
                    
                    const data = await response.json();
                    const parameters = data.parameters;
                    
                    if (!parameters || parameters.length === 0) {
                        throw new Error(`Нет параметров для договора ${contractId} в БД`);
                    }

                    // Заменяем переменные в документе
                    for (const param of parameters) {
                        const paramName = param.param_name;
                        const paramValue = param.param_value || 'Не заполнено';
                        
                        // Ищем все вхождения параметра в разных форматах
                        const patterns = [
                            `{${paramName}}`,
                            `{{${paramName}}}`,
                            `[${paramName}]`,
                            `\${${paramName}}`
                        ];
                        
                        for (const pattern of patterns) {
                            const searchResults = body.search(pattern, {
                                matchCase: false,
                                matchWholeWord: false
                            });
                            
                            searchResults.load('items');
                            await context.sync();
                            
                            // Заменяем на значение
                            for (let i = 0; i < searchResults.items.length; i++) {
                                searchResults.items[i].insertText(paramValue, Word.InsertLocation.replace);
                            }
                        }
                    }
                    
                    await context.sync();
                });

                console.log(`Variables filled successfully from DB (contract: ${contractId})`);
                alert(`Заполнено ${data.parameters.length} параметров из БД для договора ${contractId}`);
                event.completed();
                
            } catch (error) {
                console.error('Error filling variables:', error);
                alert('Ошибка: ' + error.message);
                event.completed();
            }
        }

        /**
         * Logout user
         */
        async function logout(event) {
            try {
                await apiService.logout();
                console.log('Logged out successfully');
                event.completed();
            } catch (error) {
                console.error('Error logging out:', error);
                event.completed();
            }
        }
    </script>
</body>
</html>
