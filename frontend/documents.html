<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор шаблона</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <h1>Выбор шаблона документа</h1>
        
        <div id="message" class="message" style="display: none;"></div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Загрузка документов...</p>
        </div>
        
        <div id="documentsList"></div>
        
        <div class="button-group" id="buttonGroup" style="display: none;">
            <button id="selectButton" disabled>Выбрать</button>
            <button class="btn-secondary" id="refreshButton">Обновить</button>
        </div>
    </div>

    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
    <script>
        Office.onReady(() => {
            let selectedDocument = null;
            let documents = [];

            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');
            const documentsListDiv = document.getElementById('documentsList');
            const selectButton = document.getElementById('selectButton');
            const refreshButton = document.getElementById('refreshButton');
            const buttonGroup = document.getElementById('buttonGroup');

            // Check authentication
            if (!apiService.isAuthenticated()) {
                showMessage('Пожалуйста, войдите в систему!', 'error');
                return;
            }

            // Load documents on page load
            loadDocuments();

            refreshButton.addEventListener('click', loadDocuments);

            selectButton.addEventListener('click', async () => {
                if (!selectedDocument) return;

                selectButton.disabled = true;
                selectButton.textContent = 'Загрузка...';
                hideMessage();

                try {
                    await openDocument(selectedDocument);
                    showMessage('Документ успешно открыт!', 'success');
                } catch (error) {
                    showMessage(error.message || 'Ошибка открытия документа', 'error');
                } finally {
                    selectButton.disabled = false;
                    selectButton.textContent = 'Выбрать';
                }
            });

            async function loadDocuments() {
                loadingDiv.style.display = 'block';
                documentsListDiv.innerHTML = '';
                buttonGroup.style.display = 'none';
                hideMessage();

                try {
                    documents = await apiService.getDocuments();
                    
                    if (documents.length === 0) {
                        documentsListDiv.innerHTML = '<div class="empty-state">Нет доступных шаблонов</div>';
                    } else {
                        renderDocuments(documents);
                        buttonGroup.style.display = 'flex';
                    }
                } catch (error) {
                    showMessage('Ошибка загрузки документов', 'error');
                    documentsListDiv.innerHTML = '<div class="empty-state">Не удалось загрузить документы</div>';
                } finally {
                    loadingDiv.style.display = 'none';
                }
            }

            function renderDocuments(docs) {
                const ul = document.createElement('ul');
                ul.className = 'document-list';

                docs.forEach(doc => {
                    const li = document.createElement('li');
                    li.className = 'document-item';
                    li.innerHTML = `
                        <div class="document-name">${doc.fileName || doc.file_name}</div>
                        <div class="document-meta">
                            Организация: ${doc.organizationName || doc.organization_name || 'N/A'}<br>
                            Создан: ${new Date(doc.createdAt || doc.created_at).toLocaleDateString('ru-RU')}
                        </div>
                    `;

                    li.addEventListener('click', () => {
                        // Remove selection from all items
                        document.querySelectorAll('.document-item').forEach(item => {
                            item.classList.remove('selected');
                        });

                        // Select current item
                        li.classList.add('selected');
                        selectedDocument = doc;
                        selectButton.disabled = false;
                    });

                    ul.appendChild(li);
                });

                documentsListDiv.appendChild(ul);
            }

            async function openDocument(doc) {
                const documentId = doc.documentId || doc.document_id;
                
                // Download document
                const blob = await apiService.downloadDocument(documentId);
                
                // Save document ID for later use
                localStorage.setItem(CONFIG.STORAGE_KEYS.SELECTED_DOCUMENT, JSON.stringify(doc));
                
                // Insert document into Word
                await Word.run(async (context) => {
                    // Read blob as base64
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    
                    await new Promise((resolve, reject) => {
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            
                            // Insert document content
                            const body = context.document.body;
                            body.insertFileFromBase64(base64, Word.InsertLocation.replace);
                            
                            context.sync().then(resolve).catch(reject);
                        };
                        reader.onerror = reject;
                    });
                });
            }

            function showMessage(text, type = 'info') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                messageDiv.style.display = 'block';
            }

            function hideMessage() {
                messageDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
