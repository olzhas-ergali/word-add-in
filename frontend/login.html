<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <h1>Вход в систему</h1>
        
        <div id="message" class="message" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="loginButton">Войти</button>
        </form>
    </div>

    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
    <script>
        Office.onReady(() => {
            const form = document.getElementById('loginForm');
            const messageDiv = document.getElementById('message');
            const loginButton = document.getElementById('loginButton');

            // Check if already authenticated
            if (apiService.isAuthenticated()) {
                showMessage('Вы уже авторизованы!', 'success');
                form.style.display = 'none';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                loginButton.disabled = true;
                loginButton.textContent = 'Вход...';
                hideMessage();

                try {
                    await apiService.login(username, password);
                    showMessage('Успешный вход в систему!', 'success');
                    
                    // Redirect or close taskpane after 1 second
                    setTimeout(() => {
                        form.reset();
                        form.style.display = 'none';
                        showMessage('Теперь вы можете выбрать шаблон документа', 'info');
                    }, 1000);
                    
                } catch (error) {
                    showMessage(error.message || 'Ошибка входа. Проверьте данные.', 'error');
                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent = 'Войти';
                }
            });

            function showMessage(text, type = 'info') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                messageDiv.style.display = 'block';
            }

            function hideMessage() {
                messageDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
