<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Forms</title>
    <link rel="icon" type="image/png" href="assets/icon-16.png"/>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <h1>Printable Forms</h1>
        <p>Используйте кнопки на ленте Word:</p>
        
        <ul style="margin-top: 20px; line-height: 1.8;">
            <li><strong>Параметры</strong> - Управление параметрами</li>
            <li><strong>Выбрать шаблон</strong> - Загрузка шаблона</li>
            <li><strong>Вставить переменные</strong> - Вставка переменных в документ</li>
            <li><strong>Заполнить</strong> - Заполнение переменных данными</li>
        </ul>

        <div id="status" style="margin-top: 30px; padding: 15px; background-color: #f7fafc; border: 1px solid #e2e8f0; border-radius: 4px;">
            <h2 style="margin-bottom: 10px;">Статус</h2>
            <p id="authStatus">Система готова к работе</p>
        </div>
    </div>

    <script src="src/config.js"></script>
    <script src="src/api.js"></script>
    <script>
        Office.onReady(() => {
            const authStatus = document.getElementById('authStatus');
            authStatus.textContent = 'Система готова к работе';
        });
    </script>
</body>
</html>
