<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление параметрами</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="src/styles.css">
    <style>
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            margin: 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #555;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
            margin: 2px;
        }
        .btn-edit {
            background-color: #888;
        }
        .btn-edit:hover {
            background-color: #666;
        }
        .btn-delete {
            background-color: #999;
        }
        .btn-delete:hover {
            background-color: #777;
        }
        .form-inline {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .form-inline input {
            flex: 1;
            min-width: 150px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 8px;
            min-width: 400px;
            max-width: 600px;
        }
        .modal-header {
            margin-bottom: 20px;
        }
        .modal-footer {
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Управление параметрами</h1>
        
        <div id="message" class="message" style="display: none;"></div>
        
        <div class="form-inline">
            <input type="text" id="searchContractId" placeholder="ID договора">
            <input type="text" id="searchParamName" placeholder="Имя параметра">
            <input type="text" id="searchParamValue" placeholder="Значение">
            <button onclick="searchParameters()">Поиск</button>
            <button onclick="loadParameters()" class="btn-secondary">Показать все</button>
        </div>
        
        <details>
            <summary style="cursor: pointer; padding: 10px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 4px;">
                Добавить новый параметр
            </summary>
            <form id="addForm" style="margin-top: 20px;">
                <div class="form-group">
                    <label>ID договора:</label>
                    <input type="text" id="newContractId" required>
                </div>
                <div class="form-group">
                    <label>Имя параметра:</label>
                    <input type="text" id="newParamName" required>
                </div>
                <div class="form-group">
                    <label>Значение:</label>
                    <input type="text" id="newParamValue" required>
                </div>
                <div class="form-group">
                    <label>Описание (опционально):</label>
                    <input type="text" id="newDescription">
                </div>
                <button type="submit">Добавить параметр</button>
            </form>
        </details>
        
        <div class="table-container">
            <table id="paramsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Contract ID</th>
                        <th>Параметр</th>
                        <th>Значение</th>
                        <th>Описание</th>
                        <th>Создан</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="paramsBody">
                    <tr><td colspan="7" style="text-align: center;">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Редактировать параметр</h2>
            </div>
            <form id="editForm">
                <input type="hidden" id="editParamId">
                <div class="form-group">
                    <label>Contract ID:</label>
                    <input type="text" id="editContractId" required>
                </div>
                <div class="form-group">
                    <label>Имя параметра:</label>
                    <input type="text" id="editParamName" required>
                </div>
                <div class="form-group">
                    <label>Значение:</label>
                    <input type="text" id="editParamValue" required>
                </div>
                <div class="form-group">
                    <label>Описание:</label>
                    <input type="text" id="editDescription">
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeEditModal()" class="btn-secondary">Отмена</button>
                    <button type="submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="src/config.js"></script>
    <script>
        const API_URL = CONFIG.API_BASE_URL;
        
        Office.onReady(() => {
            loadParameters();
            
            document.getElementById('addForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await addParameter();
            });
            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await updateParameter();
            });
        });

        async function loadParameters() {
            try {
                const response = await fetch(`${API_URL}/api/params/list`);
                const data = await response.json();
                
                displayParameters(data.parameters);
                updateStats(data);
                
            } catch (error) {
                showMessage('Ошибка загрузки параметров: ' + error.message, 'error');
            }
        }

        async function searchParameters() {
            const contractId = document.getElementById('searchContractId').value;
            const paramName = document.getElementById('searchParamName').value;
            const paramValue = document.getElementById('searchParamValue').value;
            
            const params = new URLSearchParams();
            if (contractId) params.append('contract_id', contractId);
            if (paramName) params.append('param_name', paramName);
            if (paramValue) params.append('param_value', paramValue);
            
            try {
                const response = await fetch(`${API_URL}/api/params/search?${params}`);
                const data = await response.json();
                displayParameters(data.parameters);
            } catch (error) {
                showMessage('Ошибка поиска: ' + error.message, 'error');
            }
        }

        async function addParameter() {
            const param = {
                contract_id: document.getElementById('newContractId').value,
                param_name: document.getElementById('newParamName').value,
                param_value: document.getElementById('newParamValue').value,
                description: document.getElementById('newDescription').value
            };
            
            try {
                const response = await fetch(`${API_URL}/api/params/add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(param)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Параметр добавлен!', 'success');
                    document.getElementById('addForm').reset();
                    loadParameters();
                } else {
                    showMessage('Ошибка: ' + data.message, 'error');
                }
                
            } catch (error) {
                showMessage('Ошибка добавления: ' + error.message, 'error');
            }
        }

        function editParameter(param) {
            document.getElementById('editParamId').value = param.id;
            document.getElementById('editContractId').value = param.contract_id;
            document.getElementById('editParamName').value = param.param_name;
            document.getElementById('editParamValue').value = param.param_value;
            document.getElementById('editDescription').value = param.description || '';
            
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function updateParameter() {
            const paramId = document.getElementById('editParamId').value;
            const param = {
                contract_id: document.getElementById('editContractId').value,
                param_name: document.getElementById('editParamName').value,
                param_value: document.getElementById('editParamValue').value,
                description: document.getElementById('editDescription').value
            };
            
            try {
                const response = await fetch(`${API_URL}/api/params/update/${paramId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(param)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Параметр обновлен!', 'success');
                    closeEditModal();
                    loadParameters();
                } else {
                    showMessage('Ошибка: ' + data.message, 'error');
                }
                
            } catch (error) {
                showMessage('Ошибка обновления: ' + error.message, 'error');
            }
        }

        async function deleteParameter(id) {
            if (!confirm('Удалить этот параметр?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/params/delete/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Параметр удален!', 'success');
                    loadParameters();
                } else {
                    showMessage('Ошибка: ' + data.message, 'error');
                }
                
            } catch (error) {
                showMessage('Ошибка удаления: ' + error.message, 'error');
            }
        }

        function displayParameters(params) {
            const tbody = document.getElementById('paramsBody');
            
            if (!params || params.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Нет параметров</td></tr>';
                return;
            }
            
            tbody.innerHTML = params.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.contract_id}</td>
                    <td><strong>${p.param_name}</strong></td>
                    <td>${p.param_value}</td>
                    <td>${p.description || '-'}</td>
                    <td>${new Date(p.created_at).toLocaleString('ru-RU')}</td>
                    <td>
                        <button class="btn-small btn-edit" onclick='editParameter(${JSON.stringify(p)})'>Изменить</button>
                        <button class="btn-small btn-delete" onclick="deleteParameter(${p.id})">Удалить</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(data) {
        }

        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
